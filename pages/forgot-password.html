<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>" />
  <title>KopiHub | Lupa Kata Sandi</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Theme -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            coffee: '#6F4E37',
            coffeeDark: '#5a3d2b',
            cream: '#F5EFEA'
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-cream flex items-center justify-center p-4">

  <!-- Container -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">

    <!-- Header Image -->
    <div class="relative">
      <img 
        src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd"
        alt="Hot Coffee Cup"
        class="h-44 w-full object-cover"
      />
      <div class="absolute inset-0 bg-black/40"></div>
      <div class="absolute inset-0 flex flex-col items-center justify-center text-white text-center px-4">
        <h1 class="text-2xl font-bold">KopiHub</h1>
        <p class="text-sm">Pemulihan Akun Anda</p>
      </div>
    </div>

    <!-- Content -->
    <div class="p-6">
      <h2 class="text-xl font-semibold text-center text-coffee mb-2">
        Lupa Kata Sandi?
      </h2>
      <p class="text-center text-sm text-gray-500 mb-6">
        Masukkan alamat email terdaftar. Kami akan mengirimkan instruksi untuk mengatur ulang kata sandi Anda.
      </p>

      <form id="forgotPasswordForm" class="space-y-4">

        <!-- Email Input -->
        <div>
          <label class="block text-sm text-gray-600 mb-1 font-medium">Alamat Email</label>
          <input 
            type="email"
            id="forgotEmail"
            required
            placeholder="nama@email.com"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-coffee text-sm"
          />
        </div>

        <!-- Button Submit -->
        <button
          type="submit"
          class="w-full bg-coffee text-white py-2.5 rounded-lg font-semibold hover:bg-coffeeDark transition text-sm"
        >
          Kirim Tautan Pemulihan
        </button>
      </form>

      <!-- Back to Login -->
      <div class="mt-6 text-center">
        <a 
          href="../index.html" 
          class="inline-flex items-center gap-1 text-sm text-gray-600 hover:text-coffee transition font-medium"
        >
          <span>←</span> Kembali ke Halaman Masuk
        </a>
      </div>

    </div>
  </div>

  <!-- JS -->
  <script src="../assets/js/scripts.js"></script>

</body>
</html>
